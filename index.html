                        <div className="relative w-full" style={{ paddingTop: '60%' }}>
                          {newImagePreview ? (
                            <img
                              src={newImagePreview}
                              alt="Recipe"
                              className="absolute top-0 left-0 w-full h-full object-cover rounded"
                            />
                          ) : (
                            <div className="absolute top-0 left-0 w-full h-full border-2 border-dashed border-gray-600 flex items-center justify-center text-white rounded">
                              <span>Click to add image</span>
                            </div>
                          )}
                          <input
                            id="recipe-image"
                            type="file"
                            accept="image/*"
                            ref={recipeImageInputRef}
                            className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
                            onChange={handleImageChange}
                            aria-label="Upload recipe image"
                          />
                        </div>
                        {newImagePreview && (
                          <button
                            onClick={() => recipeImageInputRef.current.click()}
                            className="mt-2 bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded"
                          >
                            Change Image
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                  {modalTab === 'Ingredients' && (
                    <div>
                      <p className="mb-2 text-white font-semibold">Ingredients</p>
                      {ingredients.map((ingredient, index) => (
                        <IngredientRow
                          key={index}
                          ingredient={ingredient}
                          index={index}
                          handleIngredientChange={handleIngredientChange}
                          removeIngredientRow={removeIngredientRow}
                        />
                      ))}
                      <button
                        type="button"
                        onClick={addIngredientRow}
                        className="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded mt-2"
                      >
                        + Add Ingredient
                      </button>
                    </div>
                  )}
                  {modalTab === 'Directions' && (
                    <div>
                      <label htmlFor="directions" className="block mb-1 text-white">
                        Directions
                      </label>
                      <textarea
                        id="directions"
                        rows="6"
                        placeholder="Step-by-step directions"
                        value={directions}
                        onChange={(e) => setDirections(e.target.value)}
                        className="w-full p-2 border rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-teal-400"
                      />
                    </div>
                  )}
                  {modalTab === 'Grocery' && (
                    <div>
                      <p className="mb-2 text-white font-semibold">Grocery List</p>
                      {ingredients.length === 0 ? (
                        <p className="text-white">No ingredients added.</p>
                      ) : (
                        <ul className="list-disc list-inside">
                          {ingredients.map((ing, index) => (
                            <li key={index} className="text-white">
                              {(ing.quantity ? ing.quantity + ' ' : '') +
                                (ing.unit ? ing.unit + ' ' : '') +
                                ing.name}
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  )}
                  {modalTab === 'Notes' && (
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="rating" className="block mb-1 text-white">
                          Rating
                        </label>
                        <StarRating rating={rating} setRating={setRating} />
                      </div>
                      <div>
                        <label htmlFor="notes" className="block mb-1 text-white">
                          Notes
                        </label>
                        <textarea
                          id="notes"
                          rows="4"
                          placeholder="Additional notes"
                          value={notes}
                          onChange={(e) => setNotes(e.target.value)}
                          className="w-full p-2 border rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-teal-400"
                        />
                      </div>
                    </div>
                  )}
                </div>
                <div className="p-4 border-t border-gray-700 flex justify-end">
                  <button
                    onClick={handleAddRecipe}
                    className="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded transition-colors duration-300"
                  >
                    {editingIndex !== null ? 'Update Recipe' : 'Save Recipe'}
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // Called once new recipes are parsed from ImportModal
        const handleImportRecipes = (imported) => {
          if (!imported || imported.length === 0) return;
          setRecipes((prev) => [...prev, ...imported]);
        };

        return (
          <div className="min-h-screen flex flex-col" role="document">
            <header
              className="bg-gradient-to-r from-gray-700 to-gray-900 text-white flex items-center justify-between p-4 shadow-lg"
              role="banner"
            >
              <div className="flex items-center">
                <h1 className="text-xl font-bold mr-8">TasteVault</h1>
                <nav className="hidden lg:flex space-x-4">
                  <button
                    onClick={() => {
                      setActiveTab('categories');
                      setSelectedCookbook(null);
                      setSelectedMealTime(null);
                    }}
                    className={`px-4 py-2 rounded hover:bg-gray-600 ${
                      activeTab === 'categories' ? 'bg-gray-800' : ''
                    }`}
                    role="tab"
                    aria-selected={activeTab === 'categories'}
                  >
                    Categories
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('recipes');
                      setSelectedCookbook(null);
                      setSelectedMealTime(null);
                    }}
                    className={`px-4 py-2 rounded hover:bg-gray-600 ${
                      activeTab === 'recipes' ? 'bg-gray-800' : ''
                    }`}
                    role="tab"
                    aria-selected={activeTab === 'recipes'}
                  >
                    Recipes
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('cookbooks');
                      setSelectedCookbook(null);
                      setSelectedMealTime(null);
                    }}
                    className={`px-4 py-2 rounded hover:bg-gray-600 ${
                      activeTab === 'cookbooks' ? 'bg-gray-800' : ''
                    }`}
                    role="tab"
                    aria-selected={activeTab === 'cookbooks'}
                  >
                    Cookbooks
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('mealTimes');
                      setSelectedCookbook(null);
                      setSelectedMealTime(null);
                    }}
                    className={`px-4 py-2 rounded hover:bg-gray-600 ${
                      activeTab === 'mealTimes' ? 'bg-gray-800' : ''
                    }`}
                    role="tab"
                    aria-selected={activeTab === 'mealTimes'}
                  >
                    Meal Times
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('mealPlan');
                      setSelectedCookbook(null);
                      setSelectedMealTime(null);
                    }}
                    className={`px-4 py-2 rounded hover:bg-gray-600 ${
                      activeTab === 'mealPlan' ? 'bg-gray-800' : ''
                    }`}
                    role="tab"
                    aria-selected={activeTab === 'mealPlan'}
                  >
                    Meal Plan
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('shoppingList');
                      setSelectedCookbook(null);
                      setSelectedMealTime(null);
                    }}
                    className={`px-4 py-2 rounded hover:bg-gray-600 ${
                      activeTab === 'shoppingList' ? 'bg-gray-800' : ''
                    }`}
                    role="tab"
                    aria-selected={activeTab === 'shoppingList'}
                  >
                    Shopping List
                  </button>
                </nav>
              </div>
              <div className="flex items-center space-x-4">
                <div className="hidden lg:block">
                  <AutocompleteSearch
                    searchQuery={searchQuery}
                    setSearchQuery={setSearchQuery}
                    recipes={recipes}
                    onFocus={() => setActiveTab('recipes')}
                  />
                </div>

                <div className="relative">
                  <button
                    onClick={() => setDotsMenuOpen(!dotsMenuOpen)}
                    className="p-2 rounded-full focus:outline-none bg-gray-700 hover:bg-gray-600"
                    aria-label="9-dot menu"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      className="h-6 w-6 text-white"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <circle cx="5" cy="5" r="2" />
                      <circle cx="12" cy="5" r="2" />
                      <circle cx="19" cy="5" r="2" />
                      <circle cx="5" cy="12" r="2" />
                      <circle cx="12" cy="12" r="2" />
                      <circle cx="19" cy="12" r="2" />
                      <circle cx="5" cy="19" r="2" />
                      <circle cx="12" cy="19" r="2" />
                      <circle cx="19" cy="19" r="2" />
                    </svg>
                  </button>
                  {dotsMenuOpen && (
                    <div className="absolute right-0 mt-2 w-48 bg-gray-800 border border-gray-700 rounded shadow-lg z-10">
                      <button
                        onClick={() => {
                          setDotsMenuOpen(false);
                          setShowImportModal(true);
                        }}
                        className="block w-full text-left px-4 py-2 hover:bg-gray-700"
                      >
                        Import
                      </button>
                      <button
                        onClick={() => {
                          setDotsMenuOpen(false);
                          exportVault();
                        }}
                        className="block w-full text-left px-4 py-2 hover:bg-gray-700"
                      >
                        Export
                      </button>
                      <button
                        onClick={() => {
                          setDotsMenuOpen(false);
                          shareVaultContent();
                        }}
                        className="block w-full text-left px-4 py-2 hover:bg-gray-700"
                      >
                        Share
                      </button>
                      <button
                        onClick={() => {
                          setDotsMenuOpen(false);
                          printAllRecipes();
                        }}
                        className="block w-full text-left px-4 py-2 hover:bg-gray-700"
                      >
                        Print
                      </button>
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setShowModal(true)}
                  className="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded"
                  aria-label="Add a new recipe"
                >
                  <span className="text-xl">+</span>
                </button>

                <button
                  className="lg:hidden p-2"
                  onClick={() => setMobileNavOpen(!mobileNavOpen)}
                  aria-label="Toggle navigation menu"
                >
                  <svg className="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                </button>
              </div>
            </header>

            {mobileNavOpen && (
              <nav className="bg-gradient-to-r from-gray-700 to-gray-900 text-white lg:hidden">
                <ul className="flex flex-col">
                  {['categories', 'recipes', 'cookbooks', 'mealTimes', 'mealPlan', 'shoppingList'].map(
                    (tab) => (
                      <li key={tab}>
                        <button
                          onClick={() => {
                            setActiveTab(tab);
                            setMobileNavOpen(false);
                            setSelectedCookbook(null);
                            setSelectedMealTime(null);
                          }}
                          className="block w-full text-left px-4 py-2 border-b border-gray-600"
                        >
                          {tab.charAt(0).toUpperCase() + tab.slice(1)}
                        </button>
                      </li>
                    )
                  )}
                </ul>
              </nav>
            )}

            <div className="flex-1 flex flex-col">
              <main className="p-4 md:p-8 flex-1 overflow-auto" id="main-content" tabIndex="0">
                {activeTab === 'recipes' ? (
                  <div>
                    <div className="flex space-x-4 mb-4">
                      <select
                        value={filterDish}
                        onChange={(e) => setFilterDish(e.target.value)}
                        className="p-2 border rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-teal-400"
                      >
                        <option value="">All Dish Types</option>
                        {dishTypes.map((type, index) => (
                          <option key={index} value={type}>
                            {type}
                          </option>
                        ))}
                      </select>
                      <select
                        value={filterMeal}
                        onChange={(e) => setFilterMeal(e.target.value)}
                        className="p-2 border rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-teal-400"
                      >
                        <option value="">All Meal Types</option>
                        {mealTypes.map((type, index) => (
                          <option key={index} value={type}>
                            {type}
                          </option>
                        ))}
                      </select>
                    </div>
                    {recipes.filter(
                      (r) =>
                        r.title.toLowerCase().includes(searchQuery.toLowerCase()) &&
                        (filterDish === '' || r.dishType === filterDish) &&
                        (filterMeal === '' || r.mealType === filterMeal)
                    ).length === 0 ? (
                      <p className="text-white">No recipes available.</p>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {recipes
                          .filter(
                            (r) =>
                              r.title.toLowerCase().includes(searchQuery.toLowerCase()) &&
                              (filterDish === '' || r.dishType === filterDish) &&
                              (filterMeal === '' || r.mealType === filterMeal)
                          )
                          .map((r, index) => (
                            <RecipeCard
                              key={r.id}
                              index={index}
                              recipe={r}
                              onDeleteRecipe={handleDeleteRecipe}
                              onEditRecipe={handleEditRecipe}
                            />
                          ))}
                      </div>
                    )}
                  </div>
                ) : activeTab === 'categories' ? (
                  <div id="main-content">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {dishTypes.map((cat, index) => {
                        const catRecipes = recipes.filter((r) => r.dishType === cat);
                        const customImage = categoryImages[cat];
                        const image = customImage || (catRecipes.find((r) => r.image)?.image || '');
                        return (
                          <div
                            key={index}
                            className="border rounded-lg shadow bg-gray-800 text-white p-4 hover:shadow-xl transition-shadow duration-300"
                          >
                            <div className="relative w-full" style={{ paddingTop: '75%' }}>
                              {image ? (
                                <img
                                  src={image}
                                  alt={`${cat} category`}
                                  className="absolute top-0 left-0 w-full h-full object-cover rounded-t-lg"
                                />
                              ) : (
                                <div className="absolute top-0 left-0 w-full h-full border-2 border-dashed border-gray-600 flex items-center justify-center text-white rounded-t-lg">
                                  <span>Add Image</span>
                                </div>
                              )}
                              <input
                                type="file"
                                accept="image/*"
                                className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
                                onChange={(e) => {
                                  const file = e.target.files[0];
                                  if (file) {
                                    const reader = new FileReader();
                                    reader.onloadend = () => {
                                      setCategoryImages((prev) => ({ ...prev, [cat]: reader.result }));
                                    };
                                    reader.readAsDataURL(file);
                                  }
                                }}
                                aria-label={`Upload an image for category ${cat}`}
                              />
                            </div>
                            <div className="mt-4">
                              <h3 className="text-xl font-bold text-white">{cat}</h3>
                              <p className="text-white">{catRecipes.length} recipes</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ) : activeTab === 'cookbooks' ? (
                  selectedCookbook ? (
                    <div id="main-content">
                      <button
                        onClick={() => setSelectedCookbook(null)}
                        className="mb-4 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded"
                      >
                        &larr; Back to Cookbooks
                      </button>
                      <h2 className="text-2xl font-bold mb-4 text-white">{selectedCookbook.title}</h2>
                      {recipes.filter((r) => r.cookbook === selectedCookbook.title).length === 0 ? (
                        <p className="text-white">No recipes in this cookbook.</p>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {recipes
                            .filter((r) => r.cookbook === selectedCookbook.title)
                            .map((r, index) => (
                              <RecipeCard
                                key={r.id}
                                index={index}
                                recipe={r}
                                onDeleteRecipe={handleDeleteRecipe}
                                onEditRecipe={handleEditRecipe}
                              />
                            ))}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div id="main-content">
                      <div className="flex justify-between items-center mb-4">
                        <h2 className="text-2xl font-bold text-white">Cookbooks</h2>
                        <button
                          onClick={() => setShowCreateCookbookModal(true)}
                          className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded"
                        >
                          Create Cookbook
                        </button>
                      </div>
                      {cookbooks.length === 0 ? (
                        <p className="text-white">No cookbooks available.</p>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {cookbooks.map((cb, index) => {
                            const cbRecipes = recipes.filter((r) => r.cookbook === cb.title);
                            const image = cb.image || (cbRecipes.find((r) => r.image)?.image || '');
                            return (
                              <div
                                key={index}
                                onClick={() => setSelectedCookbook(cb)}
                                className="cursor-pointer border rounded-lg shadow bg-gray-800 text-white p-4 hover:shadow-xl transition-shadow duration-300"
                              >
                                <div className="relative w-full" style={{ paddingTop: '75%' }}>
                                  {image ? (
                                    <img
                                      src={image}
                                      alt={`${cb.title} cookbook`}
                                      className="absolute top-0 left-0 w-full h-full object-cover rounded-t-lg"
                                    />
                                  ) : (
                                    <div className="absolute top-0 left-0 w-full h-full border-2 border-dashed border-gray-600 flex items-center justify-center text-white rounded-t-lg">
                                      <span>Add Image</span>
                                    </div>
                                  )}
                                </div>
                                <div className="mt-4">
                                  <h3 className="text-xl font-bold text-white">{cb.title}</h3>
                                  <p className="text-white">{cbRecipes.length} recipes</p>
                                  <div className="mt-4 flex justify-between">
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setEditCookbook({ index, data: cb });
                                      }}
                                      className="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded text-sm"
                                    >
                                      Edit
                                    </button>
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        handlePrintCookbook(cb);
                                      }}
                                      className="bg-indigo-500 hover:bg-indigo-600 text-white px-2 py-1 rounded text-sm"
                                    >
                                      Print Cookbook
                                    </button>
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        handleDeleteCookbook(cb, index);
                                      }}
                                      className="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-sm"
                                    >
                                      Delete
                                    </button>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )
                ) : activeTab === 'mealTimes' ? (
                  selectedMealTime ? (
                    <div id="main-content">
                      <button
                        onClick={() => setSelectedMealTime(null)}
                        className="mb-4 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded"
                      >
                        &larr; Back to Meal Times
                      </button>
                      <h2 className="text-2xl font-bold mb-4 text-white">{selectedMealTime}</h2>
                      {recipes.filter((r) => r.mealType === selectedMealTime).length === 0 ? (
                        <p className="text-white">No recipes for this meal time.</p>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {recipes
                            .filter((r) => r.mealType === selectedMealTime)
                            .map((r, index) => (
                              <RecipeCard
                                key={r.id}
                                index={index}
                                recipe={r}
                                onDeleteRecipe={handleDeleteRecipe}
                                onEditRecipe={handleEditRecipe}
                              />
                            ))}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div id="main-content">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {mealTypes.map((meal, index) => {
                          const mealRecipes = recipes.filter((r) => r.mealType === meal);
                          const image = mealRecipes.find((r) => r.image)?.image || '';
                          return (
                            <div
                              key={index}
                              onClick={() => setSelectedMealTime(meal)}
                              className="cursor-pointer border rounded-lg shadow bg-gray-800 text-white p-4 hover:shadow-xl transition-shadow duration-300"
                            >
                              <div className="relative w-full" style={{ paddingTop: '75%' }}>
                                {image ? (
                                  <img
                                    src={image}
                                    alt={`${meal} meal time`}
                                    className="absolute top-0 left-0 w-full h-full object-cover rounded-t-lg"
                                  />
                                ) : (
                                  <div className="absolute top-0 left-0 w-full h-full border-2 border-dashed border-gray-600 flex items-center justify-center text-white rounded-t-lg">
                                    <span>Add Image</span>
                                  </div>
                                )}
                                <input
                                  type="file"
                                  accept="image/*"
                                  className="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
                                  onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                      const reader = new FileReader();
                                      reader.onloadend = () => {
                                        /* Could store a mealType image if desired */
                                      };
                                      reader.readAsDataURL(file);
                                    }
                                  }}
                                  aria-label={`Upload an image for meal time ${meal}`}
                                />
                              </div>
                              <div className="mt-4">
                                <h3 className="text-xl font-bold text-white">{meal}</h3>
                                <p className="text-white">{mealRecipes.length} recipes</p>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )
                ) : activeTab === 'mealPlan' ? (
                  <div id="main-content">
                    <h2 className="text-2xl font-bold mb-4 text-white">Meal Plan Calendar</h2>
                    <MealPlanCalendar
                      mealPlan={mealPlan}
                      recipes={recipes}
                      mealTypes={mealTypes}
                      updateMealPlan={(day, mealType, newValue) => {
                        setMealPlan((prev) => {
                          const newPlan = { ...prev };
                          newPlan[day] = { ...newPlan[day], [mealType]: newValue };
                          return newPlan;
                        });
                      }}
                    />
                  </div>
                ) : activeTab === 'shoppingList' ? (
                  <div id="main-content">
                    <h2 className="text-2xl font-bold mb-4 text-white">Shopping List</h2>
                    <div className="mb-4 flex space-x-4">
                      <button
                        onClick={printShoppingList}
                        className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
                      >
                        Print
                      </button>
                      <button
                        onClick={downloadShoppingList}
                        className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded"
                      >
                        Download
                      </button>
                      <button
                        onClick={shareShoppingList}
                        className="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded"
                      >
                        Share
                      </button>
                    </div>
                    {getShoppingList().length === 0 ? (
                      <p className="text-white">No ingredients in the shopping list.</p>
                    ) : (
                      <ul className="list-disc list-inside">
                        {getShoppingList().map((item, index) => (
                          <li key={index} className="text-white">
                            {item.quantity} {item.unit} {item.name}
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                ) : null}
              </main>
            </div>
            <footer className="bg-gray-800 text-center text-white p-4 border-t" role="contentinfo">
              &copy; {new Date().getFullYear()} TasteVault
            </footer>

            {renderAddRecipeModal()}

            {showCreateCookbookModal && (
              <CreateCookbookModal
                onCreate={handleCreateCookbook}
                onClose={() => setShowCreateCookbookModal(false)}
              />
            )}
            {editCookbook && (
              <EditCookbookModal
                cookbook={editCookbook.data}
                onUpdate={(updatedData) => updateCookbookData(editCookbook.index, updatedData)}
                onClose={() => setEditCookbook(null)}
              />
            )}

            {showImportModal && (
              <ImportModal
                onClose={() => setShowImportModal(false)}
                onImport={handleImportRecipes}
              />
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<RecipeSaver />);
    </script>
  </body>
</html>
